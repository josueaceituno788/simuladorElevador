<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Elevador</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../styles/elevator.css" />
  </head>
  <body>
    <!-- Navbar ajustada a la parte superior -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark-custom w-100 border-bottom border-secondary-subtle"
    >
      <a class="navbar-brand text-info fw-bold" href="#">Simulador</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="conceptos.html"
              >Conceptos</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="videos.html">Videos</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Contenedor Principal en Grid -->
    <main class="container my-auto py-4">
      <div class="contenedor-principal card shadow-lg mx-auto">
        <div class="card-body p-4">
          <div class="row g-4 align-items-center">
            <!-- Panel de Control (Columna Izquierda) -->
            <div class="col-12 col-md-7 col-lg-7">
              <div class="panel d-flex flex-column gap-3">
                <h2 class="h4 text-info fw-bold mb-1">Simulador Newtoniano</h2>

                <div class="mb-2">
                  <label for="masa" class="form-label text-secondary fs-6"
                    >Masa del elevador (kg):</label
                  >
                  <input
                    type="number"
                    class="form-control bg-dark text-light border-secondary"
                    id="masa"
                    value="1000"
                    min="1"
                  />
                </div>

                <div class="mb-2">
                  <label
                    for="aceleracion"
                    class="form-label text-secondary fs-6"
                    >Magnitud de Aceleración (m/s²):</label
                  >
                  <input
                    type="number"
                    class="form-control bg-dark text-light border-secondary"
                    id="aceleracion"
                    value="2.5"
                    step="0.1"
                    min="0"
                  />
                </div>

                <!-- Grupo de Radio: Dirección -->
                <div
                  class="p-2 rounded bg-dark border border-secondary d-flex gap-4"
                >
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="mov"
                      id="sube"
                      value="subiendo"
                      checked
                    />
                    <label class="form-check-label text-light" for="sube"
                      >Subiendo</label
                    >
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="mov"
                      id="baja"
                      value="bajando"
                    />
                    <label class="form-check-label text-light" for="baja"
                      >Bajando</label
                    >
                  </div>
                </div>

                <!-- Grupo de Radio: Estado -->
                <div
                  class="p-2 rounded bg-dark border border-secondary d-flex gap-4"
                >
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="estado"
                      id="acelera"
                      value="acelerando"
                      checked
                    />
                    <label class="form-check-label text-light" for="acelera"
                      >Acelerando</label
                    >
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="estado"
                      id="desacelera"
                      value="desacelerando"
                    />
                    <label class="form-check-label text-light" for="desacelera"
                      >Desacelerando</label
                    >
                  </div>
                </div>

                <button
                  class="btn btn-primary w-100 fw-bold py-2 mt-2"
                  onclick="iniciarSimulacion()"
                >
                  Calcular y Ejecutar
                </button>

                <div class="pantalla-resultados mt-2" id="resultado">
                  Esperando parámetros de simulación...
                </div>
              </div>
            </div>

            <!-- Eje del Elevador (Columna Derecha) -->
            <div class="col-12 col-md-5 col-lg-5 d-flex justify-content-center">
              <div class="eje">
                <div class="cable" id="cableElevador"></div>
                <div class="cabina" id="cabinaElevador">
                  <div class="puerta-izq"></div>
                  <div class="puerta-der"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/elevator.js"></script>
  </body>
</html>
